<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tag Picker</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="row col-md-8">
                <label for="tag-input"><b>Tags:</b></label>
                <div id="tags">
                </div>  
                <input type="text" class="form-control" id="tag-input" autocomplete="off"
                    role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="tag-results"
                    placeholder="e.g.(javascript arrays jquery)">
                <div id="tag-results" role="listbox" aria-label="Matching tags">
                </div>
            </div>
        </div>

        <!-- js scripts -->
        <script src="Utils.js"></script>
        <script src="taglist.js"></script>
        <script src="app.js"></script>
    </body>
</html>
